<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readers' Haven - Book Registration & Order Form</title>
</head>
<body>
    <h1>Readers' Haven - Book Registration & Order Form</h1>

<form target="_blank">
<label>Customer Name:</label>
<input type="text" placeholder="Enter your name" required>
<br><br>

<label>Email Address:</label>
<input type="email" placeholder="Enter your email" required>
<br><br>

<label>Mobile Number:</label>
<input type="tel" placeholder="Enter mobile number" required>
<br><br>

<label>Age:</label>
<input type="number">
<br><br>

<label>Password:</label>
<input type="password" required>
<br><br>

<label>Delivery Date:</label>
<input type="date">
<br><br>

<label>Preferred Delivery Time:</label>
<input type="time">
<br><br>

<label>Favorite Book Category:</label>
<select required>
<option>Fiction</option>
<option>Science</option>
<option>History</option>
<option>Children's Books</option>
</select>
<br><br>

<label>Book Title:
<input type="text" required>
<br><br>

<label>Quantity:</label>
<input type="number" min="1" required>
<br><br>

<label>Payment Method:</label>
<br>
<input type="radio" name="payment"> Cash on Delivery
<input type="radio" name="payment"> Online Payment
<br><br>

<label>Additional Services:</label>
<br>
<input type="checkbox"> Gift Wrapping
<input type="checkbox"> Bookmark
<input type="checkbox"> Express Delivery
<input type="checkbox"> Greeting Card
<br><br>

<input type="hidden" value="Readers Haven Book Order">

<label>Upload Reference File:</label>
<input type="file" accept=".jpg,.png,.pdf,.doc">
<br><br>

<label>Delivery Address:</label>
<br>
<textarea rows="4" cols="30" placeholder="Enter address"></textarea>
<br><br>

<label>Special Instructions:</label>
<br>
<textarea rows="4" cols="30" placeholder="Any special instructions"></textarea>
<br><br>

<button type="submit">Submit</button>

<button type="reset">Reset</button>

</form>
</body>
</html>
